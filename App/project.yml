name: FIDOSims

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  FIDOKit:
    path: ../FIDOKit

targets:
  FIDOSims:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FIDOSims
        excludes:
          - "Resources/MockTraces"
      # Folder reference, so fixtures keep their "MockTraces/" subdirectory in the bundle.
      - path: FIDOSims/Resources/MockTraces
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).fidosims
        PRODUCT_NAME: FIDOSims
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FIDOSims/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: FIDOSims
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: FIDOSims/FIDOSims.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: FIDOKit
        product: FIDOKit

schemes:
  FIDOSims:
    build:
      targets:
        FIDOSims: all
    run:
      config: Debug
    archive:
      config: Release
